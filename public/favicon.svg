<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#334155" stroke-width="1"/>

  <!-- Document / Resume Base -->
  <rect x="7" y="7" width="18" height="20" rx="3" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.6"/>
  
  <!-- Clipboard Top Clip -->
  <rect x="12" y="4.5" width="8" height="3.5" rx="1.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Resume text lines -->
  <line x1="10.5" y1="12" x2="16.5" y2="12" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10.5" y1="15.5" x2="14.5" y2="15.5" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>

  <!-- High-contrast Checkmark / Match Indicator -->
